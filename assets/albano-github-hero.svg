<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Dominick Albano GitHub Hero</title>
  <desc id="desc">A dark terminal-inspired engineering dashboard for Dominick Albano featuring the Mac to Albano Coding Agent to white-node system flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#060b12"/>
      <stop offset="1" stop-color="#0d1724"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="420" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#7dd3fc" stroke-width="1">
    <path d="M0,80H1400 M0,160H1400 M0,240H1400 M0,320H1400"/>
    <path d="M180,0V420 M360,0V420 M540,0V420 M720,0V420 M900,0V420 M1080,0V420"/>
  </g>

  <rect x="38" y="34" width="1324" height="352" rx="18" fill="none" stroke="#23456d" stroke-width="1.2"/>
  <rect x="60" y="58" width="164" height="28" rx="14" fill="#0c1521" stroke="#1d3d5d"/>
  <text x="82" y="77" fill="#7dd3fc" font-family="monospace" font-size="13" letter-spacing="1.4">SYSTEM</text>

  <text x="72" y="125" fill="#e5f5ff" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="2">DOMINICK ALBANO</text>
  <text x="72" y="165" fill="#81e6d9" font-family="Arial, sans-serif" font-size="23" letter-spacing="1.8">FULL-STACK SOFTWARE ENGINEER</text>
  <text x="72" y="200" fill="#b8d8eb" font-family="monospace" font-size="18">React • TypeScript • Node.js • Java • Tauri • Linux</text>

  <g stroke="url(#accent)" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M200 300 L360 300 L360 240 L430 240" opacity="0.9"/>
    <path d="M430 240 L580 240 L580 300 L760 300" opacity="0.9"/>
    <path d="M760 300 L980 300 L980 242 L1060 242" opacity="0.9"/>
  </g>

  <g>
    <rect x="120" y="260" width="160" height="80" rx="14" fill="#0b1724" stroke="#2a4a66"/>
    <text x="150" y="292" fill="#a7f3d0" font-family="monospace" font-size="12">MAC</text>
    <text x="150" y="318" fill="#d9ecff" font-family="monospace" font-size="14">development</text>

    <rect x="430" y="200" width="220" height="96" rx="14" fill="#0b1724" stroke="#2a4a66"/>
    <text x="455" y="232" fill="#7dd3fc" font-family="monospace" font-size="12">ALBANO CODING AGENT</text>
    <text x="455" y="258" fill="#d9ecff" font-family="monospace" font-size="14">desktop control plane</text>
    <text x="455" y="278" fill="#d9ecff" font-family="monospace" font-size="14">Git • terminal • AI • tools</text>

    <rect x="1060" y="200" width="220" height="96" rx="14" fill="#0b1724" stroke="#2a4a66"/>
    <text x="1088" y="232" fill="#7dd3fc" font-family="monospace" font-size="12">WHITE-NODE</text>
    <text x="1088" y="258" fill="#d9ecff" font-family="monospace" font-size="14">Ubuntu • remote compute</text>
    <text x="1088" y="278" fill="#d9ecff" font-family="monospace" font-size="14">local models • workers</text>
  </g>

  <g fill="#8ec5ff" font-family="monospace" font-size="12">
    <text x="72" y="360">BUILDING SOFTWARE ACROSS THE WHOLE SYSTEM</text>
    <text x="1110" y="360" fill="#7dd3fc">STATUS: ONLINE</text>
  </g>

  <g filter="url(#glow)" stroke="#7dd3fc" stroke-width="1.2">
    <circle cx="200" cy="300" r="6" fill="#7dd3fc"/>
    <circle cx="430" cy="240" r="6" fill="#7dd3fc"/>
    <circle cx="760" cy="300" r="6" fill="#7dd3fc"/>
    <circle cx="1060" cy="242" r="6" fill="#7dd3fc"/>
  </g>
</svg>
