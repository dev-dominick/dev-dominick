<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Dominick Albano GitHub Hero</title>
  <desc id="desc">Minimal high-contrast hero with identity text and an abstract software-systems schematic.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="520" fill="url(#bg)"/>

  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <path d="M0 74H1400M0 148H1400M0 222H1400M0 296H1400M0 370H1400M0 444H1400"/>
    <path d="M100 0V520M200 0V520M300 0V520M400 0V520M500 0V520M600 0V520M700 0V520M800 0V520M900 0V520M1000 0V520M1100 0V520M1200 0V520M1300 0V520"/>
  </g>

  <rect x="44" y="34" width="1312" height="452" rx="20" fill="none" stroke="#1f3652" stroke-width="1.2"/>

  <text x="80" y="126" fill="#e6f3ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="2.4">DOMINICK ALBANO</text>
  <text x="82" y="172" fill="#8fdcff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="3.2">FULL-STACK SOFTWARE ENGINEER</text>
  <text x="82" y="208" fill="#b9d9ee" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="2.2">REACT · TYPESCRIPT · NODE.JS · JAVA · TAURI</text>

  <g transform="translate(80 250)">
    <g stroke="#67e8f9" stroke-opacity="0.5" stroke-width="1.2" fill="none">
      <path d="M48 82H232V128H414V90H600V136H786V84H972V124H1158"/>
      <path d="M48 124H186V168H372V126H556V174H744V128H930V170H1158"/>
      <path d="M232 128V168M414 90V126M600 136V174M786 84V128M972 124V170"/>
    </g>

    <path d="M48 82H232V128H414V90H600V136H786V84H972V124H1158" stroke="url(#line)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

    <g fill="#08111f" stroke="#38bdf8" stroke-width="1.5">
      <circle cx="48" cy="82" r="7"/>
      <circle cx="232" cy="128" r="7"/>
      <circle cx="414" cy="90" r="7"/>
      <circle cx="600" cy="136" r="7"/>
      <circle cx="786" cy="84" r="7"/>
      <circle cx="972" cy="124" r="7"/>
      <circle cx="1158" cy="124" r="7"/>
    </g>

    <g opacity="0.55">
      <circle cx="414" cy="90" r="34" fill="url(#pulse)"/>
      <circle cx="786" cy="84" r="36" fill="url(#pulse)"/>
    </g>
  </g>
</svg>
