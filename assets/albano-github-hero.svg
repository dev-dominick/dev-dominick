<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Dominick Albano GitHub Hero</title>
  <desc id="desc">Clean profile hero for Dominick Albano with name, title, and three engineering domains.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d14"/>
      <stop offset="100%" stop-color="#0f1b2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="520" fill="url(#bg)"/>

  <g opacity="0.14" stroke="#7dd3fc" stroke-width="1">
    <path d="M0 72H1400M0 144H1400M0 216H1400M0 288H1400M0 360H1400M0 432H1400"/>
    <path d="M116 0V520M232 0V520M348 0V520M464 0V520M580 0V520M696 0V520M812 0V520M928 0V520M1044 0V520M1160 0V520M1276 0V520"/>
  </g>

  <rect x="44" y="34" width="1312" height="452" rx="22" fill="none" stroke="#2a4364" stroke-width="1.2"/>

  <text x="80" y="122" fill="#e7f1fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="2.2">DOMINICK ALBANO</text>
  <text x="82" y="166" fill="#8fd3ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="3.4">FULL-STACK SOFTWARE ENGINEER</text>

  <rect x="80" y="194" width="520" height="4" rx="2" fill="url(#accent)"/>

  <g filter="url(#softShadow)">
    <rect x="80" y="236" width="396" height="212" rx="18" fill="#0d1724" stroke="#31506f"/>
    <rect x="502" y="236" width="396" height="212" rx="18" fill="#0d1724" stroke="#31506f"/>
    <rect x="924" y="236" width="396" height="212" rx="18" fill="#0d1724" stroke="#31506f"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="112" y="286" fill="#b8e6ff" font-size="20" font-weight="700" letter-spacing="1.2">DEVELOPER TOOLS</text>
    <text x="112" y="326" fill="#d9e7f4" font-size="19">Desktop Automation</text>
    <text x="112" y="356" fill="#d9e7f4" font-size="19">Workflow Tooling</text>
    <text x="112" y="386" fill="#d9e7f4" font-size="19">Build Systems</text>

    <text x="534" y="286" fill="#b8e6ff" font-size="20" font-weight="700" letter-spacing="1.2">AI SYSTEMS</text>
    <text x="534" y="326" fill="#d9e7f4" font-size="19">Platform State</text>
    <text x="534" y="356" fill="#d9e7f4" font-size="19">AI-Assisted Workflows</text>
    <text x="534" y="386" fill="#d9e7f4" font-size="19">Developer Interfaces</text>

    <text x="956" y="286" fill="#b8e6ff" font-size="20" font-weight="700" letter-spacing="1.2">PRODUCT SYSTEMS</text>
    <text x="956" y="326" fill="#d9e7f4" font-size="19">React Applications</text>
    <text x="956" y="356" fill="#d9e7f4" font-size="19">API Integrations</text>
    <text x="956" y="386" fill="#d9e7f4" font-size="19">Full-Stack Delivery</text>
